# ETAM-2 (Stage 2) GPU pilot: throughput, peak memory and evaluation cost of the
# reference model alone, and of a 3-run bundle of the heaviest variants on one GPU.
name: etam2_pilot_20261108
workdir: /groups/bshapira_group/guyhada/KBC
snapshot: [eventfm, scripts]
setup: |
  source "$(conda info --base)/etc/profile.d/conda.sh"
  conda activate KBC
  export KBC_DATA_ROOT=/groups/bshapira_group/guyhada/KBC_data
  export KBC_OUTPUT_ROOT=/groups/bshapira_group/guyhada/KBC_outputs
  export HF_HOME=/groups/bshapira_group/guyhada/hf_cache HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
defaults: {kind: cpu, cpus: 2, mem: 8G, time: "2:00:00"}
groups:
  - name: single
    resources: {kind: gpu, gpus: 1, constraint: "rtx_4090|rtx_6000", mem: 32G, time: "3:00:00", gpu_check: torch}
    grid: {variant: [ref]}
    command: >-
      python {code_dir}/scripts/etam2.py run stage=pretrain run_name=ref output_dir={run_dir}
      max_steps=1000 eval_every=500 warmup_steps=200 val_users=2000 eval_test_users=2000
      result_path={run_dir}/result.json
  - name: bundle
    resources: {kind: gpu, gpus: 1, constraint: "rtx_6000", mem: 40G, time: "4:00:00", gpu_check: torch}
    grid: {variant: [heavy3]}
    command: >-
      python {code_dir}/scripts/etam2_bundle.py --out {run_dir}
      --run 'ssm::stage=pretrain model.memory=ssm max_steps=600 eval_every=300 warmup_steps=100 val_users=2000 eval_test_users=2000'
      --run 'ode::stage=pretrain model.memory=ode max_steps=600 eval_every=300 warmup_steps=100 val_users=2000 eval_test_users=2000'
      --run 'stage1mtp::stage=pretrain model.mixer=stage1 model.mtp_horizon=4 model.mtp_time=true model.repr_dim=64 weights.mtp=0.5 weights.horizon=0.5 weights.repr=0.1 max_steps=600 eval_every=300 warmup_steps=100 val_users=2000 eval_test_users=2000'
harvest:
  metrics:
    single: [valid.joint_nll, test.tpp.next_type_accuracy, test.tpp.joint_nll, eval_minutes, train_minutes_segment]
